<div class="modal-overlay" id="reviewModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('reviewModal')">×</button>
        
        <div class="modal-header">
            <img src="" id="review-poster" class="modal-poster" alt="Movie">
            <div>
                <h2 id="review-title">Movie Title</h2>
                <p style="color: var(--text-main); font-size: 0.9rem;">I watched this film...</p>
            </div>
        </div>

        <form class="auth-form" onsubmit="submitForm(event, 'reviewModal', 'Review Saved!')">
            <div class="form-group">
                <label>Rating (Out of 5)</label>
                <input type="number" min="1" max="5" class="form-input" required>
            </div>
            <div class="form-group">
                <label>Review</label>
                <textarea class="form-input" rows="4" placeholder="Add a review..." required></textarea>
            </div>
            <button type="submit" class="btn primary full-width">Save</button>
        </form>
    </div>
</div>

<div class="modal-overlay" id="logModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('logModal')">×</button>
        <h2 style="margin-bottom: 1.5rem;">Log a Film</h2>
        
        <form class="auth-form" onsubmit="submitForm(event, 'logModal', 'Film Logged to Diary!')">
            <div class="form-group">
                <label>Name of Film</label>
                <input type="text" class="form-input" placeholder="e.g., The Godfather" required>
            </div>
            <div class="form-group">
                <label>Date Watched</label>
                <input type="date" class="form-input" required>
            </div>
            <button type="submit" class="btn primary full-width">Save to Diary</button>
        </form>
    </div>
</div>

<script>
    // 1. Grid Scrolling
    function scrollGrid(buttonElement, scrollOffset) {
        const grid = buttonElement.parentElement.querySelector('.movie-grid');
        grid.scrollBy({ left: scrollOffset, behavior: 'smooth' });
    }

    // 2. Authentication Check for Header
    document.addEventListener('DOMContentLoaded', () => {
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const protectedLinks = document.querySelectorAll('.protected-link');

        if (isLoggedIn) {
            const username = localStorage.getItem('username') || 'MovieBuff99';
            // Swap the Sign in button out for the Profile Link
            const headerRight = document.getElementById('nav-actions');
            headerRight.innerHTML = `
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search films..." oninput="filterMovies()">
                </div>
                <a href="#" onclick="openLogModal(); return false;" class="btn">Log Film</a>
                <a href="profile.html" class="nav-profile-link">
                    <img src="images/odst.jpg" class="nav-avatar">
                    <span>${username}</span>
                </a>
            `;
        } else {
            // Intercept clicks to protected links if not logged in
            protectedLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = 'login.html';
                });
            });
        }
    });

    // 3. Live Search Functionality
    function filterMovies() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.movie-card');

        cards.forEach(card => {
            // Find the image alt tag (since it holds the movie title)
            const img = card.querySelector('img');
            if (img && img.alt.toLowerCase().includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    // 4. Modal Functionality
    function openReviewModal(title, imgSrc) {
        // Must be logged in to review
        if(localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('review-title').textContent = title;
        document.getElementById('review-poster').src = imgSrc;
        document.getElementById('reviewModal').style.display = 'flex';
    }

    function openLogModal() {
        if(localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('logModal').style.display = 'flex';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // Close modals if clicking outside the box
    window.onclick = function(event) {
        if (event.target.classList.contains('modal-overlay')) {
            event.target.style.display = "none";
        }
    }

    // Generic form submission simulation for modals
    function submitForm(event, modalId, successMessage) {
        event.preventDefault();
        alert(successMessage); // Show a quick alert
        closeModal(modalId);   // Close the modal
        event.target.reset();  // Clear the form fields
    }
</script>
