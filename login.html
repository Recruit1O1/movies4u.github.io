<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MoviesForU</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // If already logged in, redirect away from the login page
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>

<header>
    <div class="container">
        <nav>
            <div class="logo">
                <a href="index.html">MoviesForU</a>
            </div>

            <div class="nav-links">
                <a href="profile.html">Profile</a>
                <a href="aboutus.html">About</a>
                <a href="feedback.html">Feedback</a>
            </div>

            <div class="nav-right">
                <div class="search-box">
                    <input type="text" placeholder="Find a film, list, or member...">
                </div>
            </div>
        </nav>
    </div>
</header>

<main class="container">
    <div class="auth-wrapper">
        <div class="auth-box">
            <h2>Sign In</h2>
            <p class="auth-subtitle">Welcome back to MoviesForU.</p>
            
            <form class="auth-form" onsubmit="handleLogin(event)">
                <div id="login-error" class="error-message" style="display: none;"></div>

                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. MovieBuff99" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn primary full-width" id="loginBtn">Sign In</button>
                
                <div class="auth-links">
                    <a href="#">Forgot password?</a>
                    <a href="#">Create an account</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p>© 2026 MoviesForU. All Rights Reserved.</p>
    </div>
</footer>

<script>
    function handleLogin(event) {
        event.preventDefault();
        
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const errorDiv = document.getElementById('login-error');
        const btn = document.getElementById('loginBtn');

        // Reset error state
        errorDiv.style.display = 'none';
        errorDiv.textContent = '';

        // Validate credentials (Simulated Backend)
        if (usernameInput !== 'MovieBuff99' || passwordInput !== 'password123') {
            errorDiv.textContent = 'Incorrect username or password. (Hint: MovieBuff99 / password123)';
            errorDiv.style.display = 'block';
            return;
        }

        // Proceed with login
        btn.textContent = 'Signing in...';
        btn.style.opacity = '0.7';
        btn.style.cursor = 'wait';

        setTimeout(() => {
            // Set session storage and redirect
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', usernameInput);
            window.location.href = 'index.html';
        }, 800);
    }
</script>

</body>
</html>
