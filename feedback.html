<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - MoviesForU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container">
        <nav>
            <div class="logo"><a href="index.html">MoviesForU</a></div>
            <ul class="nav-links">
                <li><a href="profile.html" class="protected-link">Profile</a></li>
                <li><a href="aboutus.html">About</a></li>
                <li><a href="feedback.html" style="color: var(--accent-green);">Feedback</a></li>
            </ul>
            <div class="nav-right">
                <a href="index.html" class="btn">Back to Home</a>
            </div>
        </nav>
    </div>
</header>

<article class="container">
    <div class="auth-wrapper">
        <div class="auth-box" style="max-width: 600px;">
            <h2>Send Feedback</h2>
            <p class="auth-subtitle">Spotted a bug or have a suggestion? Let us know!</p>
            
            <form class="auth-form" id="feedbackForm" onsubmit="handleFeedback(event)">
                
                <fieldset>
                    <legend>Contact Details</legend>
                    <table class="form-table">
                        <tr>
                            <td><label for="fname">Name:</label></td>
                            <td><input type="text" id="fname" class="form-input" placeholder="Your name" required style="width: 100%;"></td>
                        </tr>
                        <tr>
                            <td><label for="femail">Email:</label></td>
                            <td><input type="email" id="femail" class="form-input" placeholder="you@email.com" required style="width: 100%;"></td>
                        </tr>
                    </table>
                </fieldset>

                <fieldset>
                    <legend>Feedback Details</legend>
                    <table class="form-table">
                        <tr>
                            <td><label for="fcategory">Category:</label></td>
                            <td>
                                <select id="fcategory" class="form-input" required style="width: 100%;">
                                    <option value="bug">Report a Bug</option>
                                    <option value="suggestion">Feature Suggestion</option>
                                    <option value="other">Other</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label>Rate the Site:</label></td>
                            <td>
                                <input type="radio" id="rate5" name="rating" value="5" required>
                                <label for="rate5">Excellent</label><br>
                                <input type="radio" id="rate3" name="rating" value="3">
                                <label for="rate3">Average</label><br>
                                <input type="radio" id="rate1" name="rating" value="1">
                                <label for="rate1">Needs Work</label>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="fmessage">Message:</label></td>
                            <td><textarea id="fmessage" class="form-input" rows="4" placeholder="Tell us what's on your mind..." required style="width: 100%;"></textarea></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="checkbox" id="fsubscribe" name="subscribe" value="yes">
                                <label for="fsubscribe">Subscribe to newsletter</label>
                            </td>
                        </tr>
                    </table>
                </fieldset>
                
                <button type="submit" class="btn primary full-width" id="feedbackBtn">Submit Feedback</button>
            </form>
            
            <div id="feedback-success" class="success-message" style="display: none; margin-top: 1rem;">
                Thank you! Your feedback has been sent.
            </div>
        </div>
    </div>
</article>

<footer>
    <div class="container">
        <p>© <a href="aboutus.html" class="footer-link">Group 9</a> | Last updated: May 27, 2026</p>
    </div>
</footer>

<script>
    function handleFeedback(event) {
        event.preventDefault();
        const btn = document.getElementById('feedbackBtn');
        const successMsg = document.getElementById('feedback-success');
        
        btn.textContent = 'Sending...';
        btn.style.opacity = '0.7';
        
        setTimeout(() => {
            btn.style.display = 'none';
            successMsg.style.display = 'block';
        }, 1000);
    }
</script>

</body>
</html>
